services:
  # ────────────────────────────────────────────────────────────
  # Spring Boot Application
  # ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkingsystem-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parkingsystem
      SPRING_DATASOURCE_USERNAME: parkuser
      SPRING_DATASOURCE_PASSWORD: parkpass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
      APP_SYNC_INTERVAL_MS: 300000
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ────────────────────────────────────────────────────────────
  # PostgreSQL 16 + PostGIS
  # ────────────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: parkingsystem-db
    environment:
      POSTGRES_DB: parkingsystem
      POSTGRES_USER: parkuser
      POSTGRES_PASSWORD: parkpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkuser -d parkingsystem"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────
  # Redis 7 — Cache + Rate Limiting Store
  # ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: parkingsystem-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
